<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PXReader</title>
    <link rel="icon" href="icon.png" type="image/png" />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body data-theme="p5-dark">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <button id="themeStyleBtn" class="brand-mark" type="button" aria-label="当前 P5 主题，切换主题风格" title="切换主题风格">P5</button>
        </div>

        <div class="topbar-actions">
          <button id="importBooksBtn" class="file-button" type="button">
            <span aria-hidden="true">+</span>
            <strong>导入</strong>
          </button>
          <input
            id="bookInput"
            class="native-file-input"
            type="file"
            multiple
            hidden
            tabindex="-1"
            accept=".epub,.txt,.pdf,application/epub+zip,text/plain,application/pdf"
          />

          <button
            id="themeModeBtn"
            class="theme-mode-button"
            type="button"
            aria-pressed="true"
            aria-label="切换至明亮模式"
            title="切换至明亮模式"
          >
            <span id="themeModeIcon" class="theme-mode-icon" aria-hidden="true">☀</span>
          </button>

          <div class="layout-picker" role="group" aria-label="阅读版式">
            <span class="control-label">版式</span>
            <div class="layout-segments">
              <span class="layout-indicator" aria-hidden="true"></span>
              <button class="layout-option" type="button" data-layout="scroll" aria-pressed="true" title="连续滚动阅读">滚动</button>
              <button class="layout-option" type="button" data-layout="paged" aria-pressed="false" title="分页阅读">分页</button>
            </div>
          </div>
        </div>
      </header>

      <main class="workspace">
        <aside class="side-rail" aria-label="书库和目录">
          <section class="panel library-panel">
            <div class="panel-heading">
              <h2>书库</h2>
              <span id="libraryCount">0</span>
            </div>
            <div id="libraryList" class="library-list"></div>
          </section>

          <section class="panel toc-panel">
            <div id="tocHeading" class="panel-heading toc-heading" role="button" tabindex="0" aria-label="定位到当前章节" title="定位到当前章节">
              <h2>目录</h2>
              <span id="tocCount">0</span>
            </div>
            <nav id="tocList" class="toc-list" aria-label="目录"></nav>
          </section>
        </aside>

        <section class="reader-shell" aria-label="阅读区">
          <div class="reader-toolbar">
            <div class="book-meta">
              <strong id="bookTitle">未选择书籍</strong>
              <span id="bookFormat">等待导入</span>
            </div>

            <div class="reader-controls" aria-label="阅读控制">
              <button id="toggleLibraryBtn" class="icon-button" type="button" aria-label="收起或展开书库" title="书库">
                <span aria-hidden="true">&#9776;</span>
              </button>
              <button id="toggleToolsBtn" class="icon-button" type="button" aria-label="收起或展开工具栏" title="工具">
                <span aria-hidden="true">&#8981;</span>
              </button>
              <button
                id="focusThemeModeBtn"
                class="icon-button focus-theme-mode"
                type="button"
                aria-pressed="true"
                aria-label="切换至明亮模式"
                title="切换至明亮模式"
              >
                <span id="focusThemeModeIcon" class="theme-mode-icon" aria-hidden="true">☀</span>
              </button>
              <button id="zoomOutBtn" class="icon-button" type="button" aria-label="缩小" title="缩小">
                <span aria-hidden="true">&minus;</span>
              </button>
              <span id="zoomLabel" class="zoom-label">100%</span>
              <button id="zoomInBtn" class="icon-button" type="button" aria-label="放大" title="放大">
                <span aria-hidden="true">+</span>
              </button>
              <button id="zoomResetBtn" class="icon-button zoom-reset" type="button" aria-label="重置缩放" title="重置缩放">
                <span aria-hidden="true">1:1</span>
              </button>
              <button id="prevBtn" class="icon-button" type="button" aria-label="上一章或上一页" disabled>
                <span aria-hidden="true">&#9664;</span>
              </button>
              <button id="nextBtn" class="icon-button" type="button" aria-label="下一章或下一页" disabled>
                <span aria-hidden="true">&#9654;</span>
              </button>
            </div>
          </div>

          <div class="progress-track" aria-label="阅读进度">
            <div id="progressFill" class="progress-fill"></div>
          </div>

          <div id="readerViewport" class="reader-viewport" tabindex="0">
            <div class="empty-state">
              <div class="empty-state-mark" aria-hidden="true"><span>P5</span></div>
              <div class="empty-state-copy">
                <strong>从一本书开始</strong>
                <span>将 EPUB、TXT 或 PDF 放进你的阅读桌。</span>
              </div>
            </div>
          </div>

          <footer class="reader-footer">
            <div class="reader-status">
              <span id="progressLabel">0.00%</span>
              <span id="locationLabel">尚未打开书籍</span>
            </div>
            <button id="focusModeBtn" class="icon-button footer-focus" type="button" aria-label="全屏沉浸式阅读" title="全屏沉浸式阅读">
              <span aria-hidden="true">&#9633;</span>
            </button>
          </footer>
        </section>

        <aside class="search-rail" aria-label="搜索">
          <section class="panel search-panel">
            <div class="panel-heading">
              <h2>搜索</h2>
              <span id="searchCount">0</span>
            </div>
            <form id="searchForm" class="search-box">
              <input id="searchInput" type="search" placeholder="搜索正文" autocomplete="off" />
              <button type="submit" aria-label="搜索">
                <span aria-hidden="true">&#8981;</span>
              </button>
            </form>
            <button id="rebuildIndexBtn" class="index-button" type="button">重建全文索引</button>
            <div id="searchStatus" class="search-status">打开书籍后可搜索。</div>
            <div id="searchResults" class="search-results"></div>
          </section>

          <section class="panel annotation-panel">
            <div class="panel-heading">
              <h2>高亮 / 笔记</h2>
              <span id="annotationCount">0</span>
            </div>
            <div id="annotationList" class="annotation-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <button id="railBackdrop" class="rail-backdrop" type="button" aria-label="关闭侧栏" tabindex="-1"></button>

    <div id="annotationComposer" class="annotation-composer" hidden>
      <div class="annotation-quote" id="annotationQuote"></div>
      <div id="annotationColors" class="annotation-colors" aria-label="高亮颜色"></div>
      <textarea id="annotationNote" rows="3" placeholder="添加笔记"></textarea>
      <div class="annotation-actions">
        <button id="annotationSaveHighlight" type="button">高亮</button>
        <button id="annotationSaveNote" type="button">保存笔记</button>
        <button id="annotationCancel" type="button">取消</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
